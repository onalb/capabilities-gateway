# Local capabilities gateway. The deal and vacancy apps call it only when
# CAPABILITIES_GATEWAY_URL is set on those apps. This file does not start them.

services:
  capabilities-gateway:
    build: .
    ports:
      - "8010:8010"
    environment:
      PORT: "8010"
      # Blank runs capabilities_gateway.tools_lambda.handler in this container.
      TOOLS_LAMBDA_ARN: ${TOOLS_LAMBDA_ARN:-}
      # Vacancy app MCP (ask_vacancy) on the host. The public container is an override.
      VACANCY_MCP_URL: ${VACANCY_MCP_URL:-http://host.docker.internal:8000/mcp}
      VACANCY_FIT_DIR: /app/data/fits
      # Deal app publishes dynamodb-local on the host at 8003. Unset in a
      # bare process still uses the in-memory vault.
      DDB_ENDPOINT: ${DDB_ENDPOINT:-http://host.docker.internal:8003}
      DDB_TABLE: ${DDB_TABLE:-ml_interview}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-fits}
    volumes:
      - ./data/fits:/app/data/fits
    extra_hosts:
      - "host.docker.internal:host-gateway"
